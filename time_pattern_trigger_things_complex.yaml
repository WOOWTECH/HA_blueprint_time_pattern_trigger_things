blueprint:
  name: 時間模式觸發 Scene/Script（秒／分／時 三合一）
  description: >
    同時支援「每 N 秒、N 分鐘、N 小時」三種 time_pattern 觸發頻率。
    任一頻率達成即批次執行選定的 Scene 與／或 Script，
    並可搭配全域條件、時段／星期條件及完成通知。
  domain: automation
  author: WOOW TECH CO., LTD.

  # ─── Input ────────────────────────────────────────
  input:
    frequency_settings:
      name: 執行頻率設定
      icon: mdi:timer-outline
      collapsed: true
      input:
        interval_seconds_pattern:
          name: 間隔 - 秒數 (time_pattern 格式)
          description: 例如 `/10` = 每 10 秒；`*` = 不使用秒數頻率
          default: "/15"
          selector: { text: {} }

        interval_minutes_pattern:
          name: 間隔 - 分鐘 (time_pattern 格式)
          description: 例如 `/5` = 每 5 分鐘；`*` = 不使用分鐘頻率
          default: "*"
          selector: { text: {} }

        interval_hours_pattern:
          name: 間隔 - 小時 (time_pattern 格式)
          description: 例如 `/2` = 每 2 小時；`*` = 不使用小時頻率
          default: "*"
          selector: { text: {} }

    target_actions:
      name: 執行目標
      icon: mdi:play-circle-outline
      collapsed: true
      input:
        target_scenes:
          name: 要執行的 Scene (可複選)
          default: []
          selector:
            entity:
              multiple: true
              filter: { domain: scene }
        target_scripts:
          name: 要執行的 Script (可複選)
          default: []
          selector:
            entity:
              multiple: true
              filter: { domain: script }

    global_conditions_settings:
      name: 全域條件 (選填)
      icon: mdi:earth
      collapsed: true
      input:
        global_conditions:
          name: 額外全域條件
          default: []
          selector:
            condition: {}

    time_condition_settings:
      name: 時段／星期條件 (選填)
      icon: mdi:clock-time-five-outline
      collapsed: true
      input:
        after_time:
          name: 開始時間
          default: "00:00:00"
          selector: { time: {} }
        before_time:
          name: 結束時間
          default: "23:59:59"
          selector: { time: {} }
        weekdays:
          name: 生效星期
          default: [mon,tue,wed,thu,fri,sat,sun]
          selector:
            select:
              multiple: true
              mode: list
              options:
                - { label: 週一, value: mon }
                - { label: 週二, value: tue }
                - { label: 週三, value: wed }
                - { label: 週四, value: thu }
                - { label: 週五, value: fri }
                - { label: 週六, value: sat }
                - { label: 週日, value: sun }

    notify_settings:
      name: 通知設定 (選填)
      icon: mdi:cellphone-message
      collapsed: true
      input:
        send_notify:
          name: 是否通知
          default: n
          selector:
            select:
              options:
                - { label: 是, value: y }
                - { label: 否, value: n }
        notify_title:
          name: 標題 (留空自動產生)
          default: ""
          selector: { text: {} }
        notify_message:
          name: 內容 (留空自動產生，可寫 Jinja)
          default: ""
          selector: { text: {} }

# ─── Variables ─────────────────────────────────────
variables:
  _spat:   !input interval_seconds_pattern
  _mpat:   !input interval_minutes_pattern
  _hpat:   !input interval_hours_pattern
  _when:   "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  _scenes: !input target_scenes
  _scripts: !input target_scripts
  _global: !input global_conditions
  _after:  !input after_time
  _before: !input before_time
  _wday:   !input weekdays
  _send:   !input send_notify
  _title:  !input notify_title
  _msg_in: !input notify_message

# ─── Triggers：三條 time_pattern ────────────────
trigger:
  # 秒數頻率
  - platform: time_pattern
    seconds: !input interval_seconds_pattern

  # 分鐘頻率
  - platform: time_pattern
    minutes: !input interval_minutes_pattern
    seconds: 0

  # 小時頻率
  - platform: time_pattern
    hours: !input interval_hours_pattern
    minutes: 0
    seconds: 0

# ─── Conditions ────────────────────────────────────
condition:
  - condition: template
    value_template: >
      {{ _global | length == 0 or (_global) }}
  - condition: time
    after: !input after_time
    before: !input before_time
    weekday: !input weekdays

# ─── Actions ───────────────────────────────────────
action:
  # 0. 防呆：若未指定任何 Scene / Script
  - if:
      - "{{ _scenes|length == 0 and _scripts|length == 0 }}"
    then:
      - service: persistent_notification.create
        data:
          title: "頻率觸發設定錯誤"
          message: "未指定任何 Scene 或 Script，無法執行。"
      - stop: ""

  # 1. 執行 Scenes
  - if: "{{ _scenes|length > 0 }}"
    then:
      - service: scene.turn_on
        target: { entity_id: "{{ _scenes }}" }

  # 2. 執行 Scripts
  - if: "{{ _scripts|length > 0 }}"
    then:
      - service: script.turn_on
        target: { entity_id: "{{ _scripts }}" }

  # 3. 可選通知
  - if: "{{ _send == 'y' }}"
    then:
      - variables:
          _all: "{{ _scenes + _scripts }}"
          _title_f: "{{ _title | default('頻率觸發執行完成', true) }}"
          _msg: >
            {% if _msg_in %}
              {{ _msg_in }}
            {% else %}
              時間：{{ _when }}<br>
              {% for e in _all %}
                已執行「{{ state_attr(e,'friendly_name') or e }}」
                (區域：{{ area_name(e) or '未設定' }}){% if not loop.last %}<br>{% endif %}
              {% endfor %}
            {% endif %}
      - service: persistent_notification.create
        data: { title: "{{ _title_f }}", message: "{{ _msg }}" }
      - service: notify.notify
        data: { title: "{{ _title_f }}", message: "{{ _msg }}" }

mode: restart
